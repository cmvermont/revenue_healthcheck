<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevOps Healthcheck — Diagnose Your SaaS Revenue Operations</title>
    <meta name="description" content="Diagnose your SaaS revenue operations in minutes. Score pipeline health, forecasting accuracy, unit economics, and funnel efficiency." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              slate: {
                950: '#0B1120',
              }
            }
          }
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0F172A; }
      @keyframes countUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes ringFill {
        from { stroke-dashoffset: 283; }
      }
      .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
      .animate-count { animation: countUp 0.5s ease forwards; }
      .tab-content { animation: fadeIn 0.35s ease forwards; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #1E293B; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
